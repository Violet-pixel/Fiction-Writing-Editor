name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript e WebAssembly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  java:
    name: Servidor em Java
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: bash server/build.sh
      - run: bash server/test.sh

  nativo:
    name: C e C++
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/build-native.sh
      - run: bash native/tests/revisor-test.sh

  desktop:
    name: Versão desktop (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: cd desktop && mkdir -p app && cp -r ../web/. app/ && go vet ./... && rm -rf app
      - run: bash scripts/build-desktop.sh
