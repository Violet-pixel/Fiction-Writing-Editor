name: Manutenção diária

on:
  schedule:
    - cron: '17 9 * * *'
    - cron: '43 12 * * *'
    - cron: '29 15 * * *'
    - cron: '51 18 * * *'
    - cron: '37 22 * * *'
  workflow_dispatch:
    inputs:
      tarefa:
        description: Tarefa
        type: choice
        options: [testes, links, pdfs, desktop, tamanho]
        default: testes

permissions:
  contents: read

concurrency:
  group: manutencao-${{ github.event.schedule || inputs.tarefa }}
  cancel-in-progress: false

jobs:
  testes:
    name: Testes completos
    if: github.event.schedule == '17 9 * * *' || inputs.tarefa == 'testes'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm test
      - run: bash server/build.sh && bash server/test.sh
      - run: bash scripts/build-native.sh && bash native/tests/revisor-test.sh

  links:
    name: Links do README e dos manuais
    if: github.event.schedule == '43 12 * * *' || inputs.tarefa == 'links'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --exclude 'archiveofourown\.org' --exclude 'wattpad\.com' README.md CHANGELOG.md docs/pdf-src/manual.html docs/pdf-src/banco-de-dados.html
          fail: true

  pdfs:
    name: Manuais em PDF
    if: github.event.schedule == '29 15 * * *' || inputs.tarefa == 'pdfs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Conferir se as fontes dos PDFs mudaram
        id: hash
        run: |
          atual=$(find docs/pdf-src docs/images scripts/build-pdfs.js -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "atual=$atual" >> "$GITHUB_OUTPUT"
          if [ "$atual" = "$(cat docs/.fonte-pdfs.sha256 2>/dev/null)" ]; then echo "mudou=nao" >> "$GITHUB_OUTPUT"; else echo "mudou=sim" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v5
        if: steps.hash.outputs.mudou == 'sim'
        with:
          node-version: 22
      - name: Gerar os PDFs
        if: steps.hash.outputs.mudou == 'sim'
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx --prefix /tmp/pw playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE" && NODE_PATH=/tmp/pw/node_modules node scripts/build-pdfs.js
          echo "${{ steps.hash.outputs.atual }}" > docs/.fonte-pdfs.sha256
      - name: Gravar
        if: steps.hash.outputs.mudou == 'sim'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Manual-Serifa.pdf Banco-de-Dados-Serifa.pdf docs/Manual-Serifa.pdf docs/Banco-de-Dados-Serifa.pdf docs/.fonte-pdfs.sha256
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza os manuais em PDF"
          git pull --rebase && git push

  desktop:
    name: Serifa.exe
    if: github.event.schedule == '51 18 * * *' || inputs.tarefa == 'desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Conferir se o site ou o código desktop mudaram
        id: hash
        run: |
          atual=$(find web desktop/main.go desktop/sistema_windows.go desktop/sistema_outros.go desktop/go.mod scripts/build-desktop.sh VERSION -type f | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "atual=$atual" >> "$GITHUB_OUTPUT"
          if [ "$atual" = "$(cat desktop/.fonte-exe.sha256 2>/dev/null)" ]; then echo "mudou=nao" >> "$GITHUB_OUTPUT"; else echo "mudou=sim" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v5
        if: steps.hash.outputs.mudou == 'sim'
        with:
          go-version: '1.24'
          cache: false
      - name: Compilar e gravar
        if: steps.hash.outputs.mudou == 'sim'
        run: |
          bash scripts/build-desktop.sh
          echo "${{ steps.hash.outputs.atual }}" > desktop/.fonte-exe.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Serifa.exe desktop/.fonte-exe.sha256
          git diff --cached --quiet && exit 0
          git commit -m "Recompila o Serifa.exe"
          git pull --rebase && git push

  tamanho:
    name: Tamanho e integridade
    if: github.event.schedule == '37 22 * * *' || inputs.tarefa == 'tamanho'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Projeto com no máximo 90 MB
        run: |
          total=$(du -sb --exclude=.git . | cut -f1)
          echo "Tamanho: $((total / 1048576)) MB" >> "$GITHUB_STEP_SUMMARY"
          [ "$total" -le $((90 * 1048576)) ] || { echo "::error::O projeto passou de 90 MB"; exit 1; }
      - name: Arquivos usados pelo site existem
        run: |
          falta=0
          for f in $(grep -oE '(href|src)="[^"#:]+"' web/index.html | sed -E 's/^(href|src)="//; s/"$//'); do
            [ -e "web/$f" ] || { echo "::error::Falta web/$f"; falta=1; }
          done
          for f in $(grep -oE "url\('\.\./fontes/[^']+'\)" web/css/fontes.css | sed -E "s/url\('\.\.\///; s/'\)//"); do
            [ -e "web/$f" ] || { echo "::error::Falta web/$f"; falta=1; }
          done
          for j in web/dados/*.json tests/fixtures/*.json; do node -e "JSON.parse(require('fs').readFileSync('$j','utf8'))" || falta=1; done
          exit $falta
