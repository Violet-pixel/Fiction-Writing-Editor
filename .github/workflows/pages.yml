name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar o site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Conferir se o GitHub Pages está ativado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" --silent; then
            echo "::error title=GitHub Pages desativado::Abra Settings > Pages, em Build and deployment escolha Source: GitHub Actions e rode este workflow de novo (Actions > GitHub Pages > Run workflow)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
